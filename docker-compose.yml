services:
  api:
    build: ./api
    environment:
      # How often to check DIBBS for new daily files (0 disables the schedule).
      INGEST_INTERVAL_MINUTES: 60
    volumes:
      - dibbs-data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dibbs-data:
